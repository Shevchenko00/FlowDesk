
services:
  flow_desk_backend:
    build:
      context: ./backend
    container_name: flow_desk_backend
    volumes:
      - ./backend:/app
    ports:
      - "2222:2222"
    working_dir: /app
    depends_on:
      flow_desk_postgres:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 2222 --reload" 

  flow_desk_postgres:
    image: postgres:15
    container_name: flow_desk_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: flow_desk_postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

